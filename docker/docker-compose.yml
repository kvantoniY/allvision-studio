services:
  postgres:
    image: postgres:16
    container_name: allvision-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: allvision
      POSTGRES_PASSWORD: allvision_pass
      POSTGRES_DB: allvision
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allvision -d allvision"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: allvision-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
