# LiveKit SFU для живых уроков Academy (A8).
# Запускается в host-network: WebRTC плохо переживает docker-проброс UDP-диапазона
# (docker-proxy на каждый порт) и NAT внутри бриджа.
port: 7880

rtc:
  # ICE/TCP-фолбэк, когда UDP у клиента зарезан (частая история в школах/офисах).
  tcp_port: 7881
  # Узкий UDP-диапазон: на 2 участников урока хватает с запасом,
  # а открывать 10k портов в облачном фаерволе не нужно.
  port_range_start: 50000
  port_range_end: 50200
  # ВМ за 1:1 NAT облака: публичный адрес определяется через STUN.
  use_external_ip: true

# Ключи приходят из окружения LIVEKIT_KEYS (см. shared/.env на ВМ),
# формат: "APIkey: secret". Секрет в репозиторий не коммитится.

logging:
  level: info
  json: false

room:
  # Комната создаётся при первом входе и живёт 5 минут после ухода последнего,
  # чтобы перезаход на плохой связи не терял сессию.
  auto_create: true
  empty_timeout: 300
  max_participants: 8

turn:
  # Встроенный TURN выключен: 443 занят хостовым nginx, а ICE/TCP 7881
  # закрывает те же сценарии без отдельного сертификата.
  enabled: false
