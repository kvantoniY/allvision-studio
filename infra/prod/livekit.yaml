# LiveKit SFU для живых уроков Academy (A8).
# Запускается в host-network: WebRTC плохо переживает docker-проброс UDP-диапазона
# (docker-proxy на каждый порт) и NAT внутри бриджа.
port: 7880

rtc:
  # ОДИН UDP-порт (UDP-mux), а не диапазон. Диапазон заставлял LiveKit отдавать
  # клиенту ДЕСЯТКИ host-кандидатов (по порту на каждый PC) — ICE бесконечно
  # перебирал пары («switched pair»), связь флапала и срабатывал 15-секундный
  # peerConnectionTimeout клиента → полный реконнект → камера/микрофон отваливались.
  # Единый порт = один кандидат = ICE устаканивается мгновенно и держится.
  udp_port: 50000
  # ICE/TCP-фолбэк, когда UDP у клиента зарезан (школы/офисы).
  tcp_port: 7881
  # У ВМ статический публичный адрес за 1:1 NAT облака. Объявляем его явно
  # (в host-network STUN мог бы подмешать приватный 10.x интерфейс ВМ).
  # ВАЖНО: при смене публичного IP ВМ этот адрес нужно обновить.
  use_external_ip: false
  node_ip: 158.160.209.107

# Ключи приходят из окружения LIVEKIT_KEYS (см. shared/.env на ВМ),
# формат: "APIkey: secret". Секрет в репозиторий не коммитится.

logging:
  level: info
  json: false

room:
  # Комната создаётся при первом входе и живёт 5 минут после ухода последнего,
  # чтобы перезаход на плохой связи не терял сессию.
  auto_create: true
  empty_timeout: 300
  max_participants: 8

turn:
  # Встроенный TURN-релей (UDP): когда клиент не может достучаться напрямую до
  # диапазона 50000-50200 (частая история за строгим NAT/файрволом), медиа идёт
  # через relay на порту 3478 — сервер сам раздаёт клиентам эти ICE-серверы.
  # turn.allvision-pulse.ru уже указывает на ВМ (A-запись).
  # ВАЖНО: в облачном фаерволе (Security Group) должен быть открыт UDP 3478.
  # TLS-TURN (turns:443) не включаем: 443 занят nginx, а на turn-домен нет сертификата;
  # UDP 3478 + ICE/TCP 7881 закрывают подавляющее большинство сетей.
  enabled: true
  domain: turn.allvision-pulse.ru
  udp_port: 3478
